# What can be configured in Salus itself. The values are stored in salus.toml in the config directory.

[[setting]]
key = "plugins_dir"
name = "Plugins directory"
description = """Where plugins are installed. A relative path is taken relative to the config directory. \
Empty means the plugins folder of the platform's data directory. Takes effect after Salus is restarted."""
type = "directory-path"
default = ""

[[setting]]
key = "umask"
name = "File permissions (umask)"
description = """The umask Salus and all plugins work with: which permissions new files and folders do not get. 002: \
your group may change them too (for projects that several users share, together with a shared group); 022: others may \
only read them; 077: only you. Octal, as in the shell's umask command. Empty: keep the umask Salus was started with. Takes \
effect after Salus is restarted."""
type = "string"
default = ""

[[setting]]
key = "theme"
name = "Theme"
description = "The colors of Salus and of all plugins: dark or light."
type = "choice"
choices = ["dark", "light"]
default = "dark"

[[setting]]
key = "autostart"
name = "Autostart"
description = """Plugins (their identifiers, e.g. org.salus.systeminfo) that Salus opens on its own after you log in, in this \
order, as if you had opened each from the dock. Reloading the page does not open them again. Identifiers of plugins that are \
not installed, or that cannot be opened from the dock, are skipped."""
type = "plugin-list"
default = []
