[package]
name = "web"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
api = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
wasm-bindgen = "0.2.128"
web-sys = { version = "0.3.105", features = ["HtmlIFrameElement"] }
gloo-net = "0.6.0"
futures = "0.3.34"
postcard = { version = "1.1.3", features = ["alloc"] }
serde_bytes = "0.11.19"
serde-wasm-bindgen = "0.6.5"

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server", "api/server"]
