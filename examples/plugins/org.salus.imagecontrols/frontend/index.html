<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Controls</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="pad">
        <button data-command="zoom-out" title="Zoom out (-)">&minus;</button>
        <button data-command="up" title="Move up (arrow up)">&uarr;</button>
        <button data-command="zoom-in" title="Zoom in (+)">+</button>
        <button data-command="left" title="Move left (arrow left)">&larr;</button>
        <button data-command="reset" title="Reset (0)">reset</button>
        <button data-command="right" title="Move right (arrow right)">&rarr;</button>
        <span></span>
        <button data-command="down" title="Move down (arrow down)">&darr;</button>
        <span></span>
    </div>
    <div id="status"></div>
    <script type="module" src="script.js"></script>
</body>
</html>
